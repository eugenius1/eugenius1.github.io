# --- General options --- #

theme: jekyll-theme-chirpy
lang: en
timezone: Europe/London

url: "https://eusebius.tech"
baseurl: ""

title: Eusebius.Tech
tagline: Eusebius Ngemera
description: Personal website of Eusebius Ngemera, including a blog of technologies and life as he knows it.

avatar: "/img/eusebius-avatar-icon.jpg"
# Image to use when a page has none, when sharing to social media
social_preview_image: "/raw/img/branding/github-eugenius1/original.png"

github:
  username: eugenius1
twitter:
  username: esebi95
social:
  name: Eusebius Ngemera
  email: me@eusebius.tech
  links:
    # The first one is linked from the footer and each post's author
    - https://github.com/eugenius1
    - https://twitter.com/esebi95
    - https://www.linkedin.com/in/eusebius
    - https://www.instagram.com/esebi95

# Keep empty to follow the system setting, with a toggle in the sidebar. Set to
# light or dark to fix the look.
theme_mode:

# --- Comments and analytics --- #

comments:
  provider: disqus
  disqus:
    shortname: eusebiustech

analytics:
  google:
    id: G-ME9VJ7Y5RR

# --- Don't need to touch anything below here (but you can if you want) --- #

toc: true
paginate: 5
# Also gives every other page a folder-style address
permalink: /blog/:title/

kramdown:
  input: GFM
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter_opts:
    block:
      line_numbers: true # the theme's code blocks and Copy button rely on this

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: projects
      type: pages
    values:
      comments: true
  - scope:
      path: archive
    values:
      sitemap: false
  - scope:
      path: raw
    values:
      sitemap: false
  - scope:
      path: test
    values:
      sitemap: false
  - scope:
      path: google339d224e50a4dae4.html
    values:
      sitemap: false

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  ignore:
    envs: [development]

# Exclude these files from production site
exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - Makefile
  - Dockerfile
  - compose.yaml
  - scripts
  - README.md
  - "**/README.md"
  - "*.vscode"
  - vendor

plugins:
  - jekyll-redirect-from

jekyll-archives:
  enabled: [tags]
  layouts:
    tag: tag
  permalinks:
    tag: /tags/:name/
