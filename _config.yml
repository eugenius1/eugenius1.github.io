# --- General options --- #

theme: jekyll-theme-chirpy
lang: en
timezone: Europe/London

url: "https://eusebius.tech"
baseurl: ""

title: Eusebius.Tech
tagline: Eusebius Ngemera
description: Personal website of Eusebius Ngemera, including a blog of technologies and life as he knows it.

avatar: "/assets/img/eusebius-avatar-icon-480.jpg"
# Image to use when a page has none, when sharing to social media
social_preview_image: "/assets/img/branding/github-eugenius1/original-1200.png"
# How wide the text column is, for the browser to pick the size of an image from
# _images/ to load. It's at most 780px from 1200px wide, and 820px below that.
text_column_sizes: "(min-width: 1200px) 780px, (min-width: 768px) 820px, 100vw"

github:
  username: eugenius1
twitter:
  username: esebi95
social:
  name: Eusebius Ngemera
  email: me@eusebius.tech
  links:
    # The first one is linked from the footer and each post's author
    - https://eusebius.tech/about-me/
    - https://github.com/eugenius1
    - https://twitter.com/esebi95
    - https://www.linkedin.com/in/eusebius
    - https://www.instagram.com/esebi95

# Keep empty to follow the system setting, with a toggle in the sidebar. Set to
# light or dark to fix the look.
theme_mode:

# --- Comments and analytics --- #

comments:
  provider: disqus
  disqus:
    shortname: eusebiustech

analytics:
  google:
    id: G-ME9VJ7Y5RR

# --- Don't need to touch anything below here (but you can if you want) --- #

toc: true
paginate: 5
# Also gives every other page a folder-style address
permalink: /blog/:title/

kramdown:
  input: GFM
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter_opts:
    block:
      line_numbers: true # the theme's code blocks and Copy button rely on this

collections:
  tabs:
    output: true
    sort_by: order
  # Short links and old addresses that send visitors elsewhere. Each sets its
  # own permalink, so the folders inside are only for tidiness.
  redirects:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: projects
      type: pages
    values:
      comments: true
      share: true
  - scope:
      path: archive
    values:
      sitemap: false
  - scope:
      path: raw
    values:
      sitemap: false
  - scope:
      path: test
    values:
      sitemap: false
  - scope:
      path: google339d224e50a4dae4.html
    values:
      sitemap: false

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  ignore:
    envs: [development]

# Exclude these files from production site
exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - Makefile
  - Dockerfile
  - compose.yaml
  - package.json
  - package-lock.json
  - tsconfig.json
  - lighthouserc.json
  - lychee.toml
  - node_modules
  - scripts
  # Screenshots for pull requests, not pages
  - docs
  - README.md
  - "**/README.md"
  - "*.vscode"
  - vendor
  # The dev build, so `make preview` doesn't rebuild each time `make local` does
  - _site

plugins:
  - jekyll-redirect-from

jekyll-archives:
  enabled: [tags]
  layouts:
    tag: tag
  permalinks:
    tag: /tags/:name/
