name: Links to other sites

# Weekly rather than on pull requests, as other sites go down or block bots now and
# then, which shouldn't fail anyone's change. Dead links go in a single issue,
# updated each run and closed once they're all fixed. Settings and exclusions are
# in lychee.toml.
on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: links
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The same production build as the build job in jekyll_pages.yml
      - name: Build site
        run: make check
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress '_site/**/*.html'
          output: lychee/out.md
          fail: false
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          TITLE: Dead links to other sites
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --author 'app/github-actions' --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | first | .number // empty")
          if [ "$EXIT_CODE" = 0 ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "All links work again as of $RUN_URL."
            fi
            exit 0
          fi
          # 2 means dead links. Anything else is lychee itself failing, such as a
          # mistake in lychee.toml, which should fail the run rather than file an issue.
          if [ "$EXIT_CODE" != 2 ]; then
            echo "lychee failed with exit code $EXIT_CODE" >&2
            exit 1
          fi
          {
            echo "Found by the weekly link check ($RUN_URL). Fix the link in the source, link to an archived copy on the Wayback Machine if the page has gone for good, or exclude the site in \`lychee.toml\` if it always blocks bots."
            echo
            # GitHub caps an issue's body at 65,536 characters; the run's summary has it all
            head -c 60000 lychee/out.md
          } > body.md
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
