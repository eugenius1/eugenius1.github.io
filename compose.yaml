services:
  site:
    build: .
    volumes:
      - .:/site
    ports:
      # Only this machine, as the dev build includes drafts
      # The Makefile sets these, so each checkout or worktree can run its own
      - "127.0.0.1:${PORT:-4000}:${PORT:-4000}"
      - "127.0.0.1:${LIVERELOAD_PORT:-35729}:${LIVERELOAD_PORT:-35729}"
    command: >-
      bundle exec jekyll serve --drafts --livereload --host 0.0.0.0
      --port ${PORT:-4000} --livereload-port ${LIVERELOAD_PORT:-35729}

  # Compiles _ts/ to js/ and again on each change, which Jekyll then picks up
  node:
    build:
      context: .
      target: node
    volumes:
      - .:/site
    # Hides any node_modules on the host, so Node uses the image's packages, and
    # keeps Vitest's cache out of the repository
    tmpfs: /site/node_modules
    # Stops the watcher straight away on Ctrl-C
    init: true
    command: npm run watch
