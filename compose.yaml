services:
  site:
    build: .
    volumes:
      - .:/site
    ports:
      # Only this machine, as the dev build includes drafts
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:35729:35729"
    command: bundle exec jekyll serve --drafts --livereload --host 0.0.0.0

  # Compiles _ts/ to js/ and again on each change, which Jekyll then picks up
  node:
    build:
      context: .
      target: node
    volumes:
      - .:/site
    command: npm run watch
